<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circles</title>
    <style>
      .circle {
        border: 2px solid black;
        box-sizing: border-box;
        border-radius: 50%;
        margin: 0 auto;
        width: 0px;
        height: 0px;
      }
    </style>
  </head>
  <body>
    <h1>Dibuja tu circulo:</h1>
    <form>
      <div>
        <label for="radio">Radio (<span></span>):</label>
        <br />
        <input
          type="range"
          id="radio"
          name="radio"
          min="0"
          max="500"
          step="6"
          value="0"
        />
      </div>
    </form>

    <div class="circle"></div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
